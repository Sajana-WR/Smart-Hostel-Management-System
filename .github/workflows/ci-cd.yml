name: Smart Hostel CI/CD Pipeline

# ─────────────────────────────────────────
#  When does this run?
# ─────────────────────────────────────────
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ─────────────────────────────────────────
#  Jobs
# ─────────────────────────────────────────
jobs:

  # ═══════════════════════════════════════
  #  JOB 1: Build & Test Backend (Spring Boot)
  # ═══════════════════════════════════════
  backend-build:
    name: 🧪 Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot project
        working-directory: ./smart-hostel-backend
        run: mvn clean package -DskipTests

      - name: Run tests
        working-directory: ./smart-hostel-backend
        run: mvn test
        continue-on-error: true

  # ═══════════════════════════════════════
  #  JOB 2: Build & Test Frontend (React)
  # ═══════════════════════════════════════
  frontend-build:
    name: ⚛️ Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./smart-hostel-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./smart-hostel-frontend
        run: npm ci

      - name: Build production bundle
        working-directory: ./smart-hostel-frontend
        run: npm run build

  # ═══════════════════════════════════════
  #  JOB 3: Test AI Service (Python)
  # ═══════════════════════════════════════
  ai-service-build:
    name: 🤖 Test AI Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./ai-service
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        working-directory: ./ai-service
        run: python -m py_compile app.py

  # ═══════════════════════════════════════
  #  JOB 4: Build & Push Docker Images
  # ═══════════════════════════════════════
  docker-push:
    name: 🐳 Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build, ai-service-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ─── Backend image ───
      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./smart-hostel-backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-hostel-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-hostel-backend:${{ github.sha }}

      # ─── Frontend image ───
      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./smart-hostel-frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-hostel-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-hostel-frontend:${{ github.sha }}

      # ─── AI Service image ───
      - name: Build & push AI service image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-hostel-ai:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-hostel-ai:${{ github.sha }}

  # ═══════════════════════════════════════
  #  JOB 5: Deploy to Server (Optional)
  # ═══════════════════════════════════════
  deploy:
    name: 🚀 Deploy to Server
    runs-on: ubuntu-latest
    needs: docker-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/smart-hostel
            docker-compose pull
            docker-compose up -d
            docker system prune -f
        continue-on-error: true