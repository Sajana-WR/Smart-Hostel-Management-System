
name: Smart Hostel CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ========================================
  # JOB 1: Build and Test Spring Boot
  # ========================================
  backend-build:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: smart-hostel-backend/pom.xml

      - name: Check Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Build and run JUnit tests
        working-directory: ./smart-hostel-backend
        run: mvn --batch-mode clean verify -DfailIfNoTests=true

      - name: Verify automated test results
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          report_dir = Path(
              "smart-hostel-backend/target/surefire-reports"
          )

          reports = list(report_dir.glob("TEST-*.xml"))

          if not reports:
              raise SystemExit("No JUnit test reports found!")

          totals = {
              "tests": 0,
              "failures": 0,
              "errors": 0,
              "skipped": 0
          }

          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, 0))

          print("JUnit Results:", totals)

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8"
          ) as summary:
              summary.write("## JUnit Test Results\n\n")
              for key, value in totals.items():
                  summary.write(f"- {key}: {value}\n")

          if totals["tests"] < 12:
              raise SystemExit(
                  "Expected at least 12 automated tests!"
              )

          if totals["failures"] or totals["errors"]:
              raise SystemExit("JUnit tests failed!")

          if totals["skipped"]:
              raise SystemExit("Some JUnit tests were skipped!")
          PY

      - name: Upload JUnit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-junit-reports
          path: smart-hostel-backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  # ========================================
  # JOB 2: Build React Frontend
  # ========================================
  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: smart-hostel-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./smart-hostel-frontend
        run: npm ci

      - name: Build React application
        working-directory: ./smart-hostel-frontend
        run: npm run build

  # ========================================
  # JOB 3: Validate Python AI Service
  # ========================================
  ai-service-build:
    name: Validate AI Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install AI dependencies
        working-directory: ./ai-service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        working-directory: ./ai-service
        run: python -m py_compile app.py

  # ========================================
  # JOB 4: Build and Push Docker Images
  # ========================================
  docker-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend-build
      - frontend-build
      - ai-service-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./smart-hostel-backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-hostel-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-hostel-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./smart-hostel-frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-hostel-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-hostel-frontend:${{ github.sha }}

      - name: Build and push AI image
        uses: docker/build-push-action@v7
        with:
          context: ./ai-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-hostel-ai:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-hostel-ai:${{ github.sha }}

  # ========================================
  # JOB 5: Optional Server Deployment
  # ========================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: docker-push

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_SERVER_DEPLOY == 'true'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/smart-hostel
            docker compose pull
            docker compose up -d
            docker compose ps
